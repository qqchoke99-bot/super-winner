name: Package Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: ndk-ify/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install CMake & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Build Mod
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28
          cmake --build build

      - name: Create LeviPackage
        run: |
          mkdir -p pack_out/arm64-v8a
          cp build/*.so pack_out/arm64-v8a/
          if [ -f "manifest.json.in" ]; then
            cp manifest.json.in pack_out/manifest.json
          elif [ -f "manifest.json" ]; then
            cp manifest.json pack_out/
          fi
          cd pack_out
          zip -r ../SoundPhysicsLite-v0.8-MVP.levipack .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPhysicsLite-v0.8-MVP
          path: SoundPhysicsLite-v0.8-MVP.levipack
